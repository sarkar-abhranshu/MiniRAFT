services:
  gateway:
    build:
      context: ./gateway
    environment:
      PORT: 4000
      REPLICAS: "http://replica1:5001,http://replica2:5002,http://replica3:5003"
      LEADER_POLL: "1000"
    ports:
      - "4000:4000"
    networks:
      - raft-net
    volumes:
      - ./gateway:/app
      - /app/node_modules
    depends_on:
      - replica1
      - replica2
      - replica3

  replica1:
    build:
      context: ./replica
    environment:
      NODE_ID: replica1
      PORT: 5001
      PEERS: "http://replica2:5002,http://replica3:5003"
    ports:
      - "5001:5001"
    networks:
      - raft-net
    volumes:
      - ./replica:/app
      - /app/node_modules

  replica2:
    build:
      context: ./replica
    environment:
      NODE_ID: replica2
      PORT: 5002
      PEERS: "http://replica1:5001,http://replica3:5003"
    ports:
      - "5002:5002"
    networks:
      - raft-net
    volumes:
      - ./replica:/app
      - /app/node_modules

  replica3:
    build:
      context: ./replica
    environment:
      NODE_ID: replica3
      PORT: 5003
      PEERS: "http://replica1:5001,http://replica2:5002"
    ports:
      - "5003:5003"
    networks:
      - raft-net
    volumes:
      - ./replica:/app
      - /app/node_modules

networks:
  raft-net:
    driver: bridge
